<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 히어로 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EAF6FF;
  --sun:#FFC93C;
  --coral:#FF6B6B;
  --grape:#8B5CF6;
  --teal:#22B8A8;
  --ink:#2B2B3D;
  --paper:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%, #FFE7A3 0%, transparent 40%),
    radial-gradient(circle at 90% 20%, #C9EFFF 0%, transparent 45%),
    radial-gradient(circle at 50% 90%, #FFD6E8 0%, transparent 45%),
    var(--sky);
  min-height:100vh;
}
h1,h2,h3,.font-display{font-family:'Baloo 2',sans-serif;}
button{font-family:'Nunito',sans-serif; cursor:pointer;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 18px;}
.brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;font-size:20px;}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--coral);display:inline-block;}
.navbtn{border:3px solid var(--ink);background:var(--paper);border-radius:14px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);}
.navbtn:active{box-shadow:1px 1px 0 var(--ink);transform:translate(2px,2px);}
.card-panel{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:26px 26px;box-shadow:8px 8px 0 var(--ink);margin-bottom:20px;}
.hero-title{font-size:30px;font-weight:800;line-height:1.15;margin:0 0 8px;}
.hero-sub{font-size:15px;color:#555;margin:0 0 20px;font-weight:600;}
label.field-label{display:block;font-weight:800;font-size:14px;margin:14px 0 6px;}
input[type=text], input[type=password], select, textarea{
  width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;
  font-size:18px;font-family:'Nunito';font-weight:700;background:#FFFDF5;
}
.abilityInput{ font-family:'Poppins',sans-serif; font-size:18px; font-weight:600; letter-spacing:0.2px; }
input:focus, select:focus, textarea:focus{outline:3px solid var(--grape);outline-offset:1px;}
input.active-field{outline:3px solid var(--teal);}
.row2{display:flex;gap:14px;}
.row2 > div{flex:1;}
.big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid var(--ink);border-radius:18px;padding:14px 22px;font-weight:800;font-size:17px;box-shadow:5px 5px 0 var(--ink);background:var(--sun);color:var(--ink);width:100%;margin-top:20px;}
.big-btn:active{box-shadow:2px 2px 0 var(--ink);transform:translate(3px,3px);}
.big-btn.coral{background:var(--coral);color:#fff;}
.big-btn.grape{background:var(--grape);color:#fff;}
.big-btn.teal{background:var(--teal);color:#fff;}
.ability-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.mini-label{font-weight:800;font-size:12px;color:#777;margin:8px 0 6px;}
.ability-prefix{font-weight:800;font-size:16px;background:var(--ink);color:#fff;padding:10px 12px;border-radius:12px;white-space:nowrap;font-family:'Poppins',sans-serif;}
.wordbank{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px;}
.wordchip{border:3px solid var(--ink);background:#F1FBFF;border-radius:14px;padding:10px 6px;font-weight:700;font-size:16px;text-align:center;font-family:'Poppins',sans-serif;}
.wordchip small{display:block;font-weight:600;font-size:12px;color:#666;margin-top:3px;font-family:'Nunito';}
.wordchip:active{background:var(--sun);}
.section-tag{display:inline-block;font-weight:800;font-size:13px;background:var(--teal);color:#fff;padding:4px 12px;border-radius:999px;margin-bottom:10px;}
.section-tag.pink{background:var(--coral);}
.section-tag.grape{background:var(--grape);}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start;}
@media (max-width:880px){ .two-col{grid-template-columns:1fr;} }
.search-box{position:relative;}
.search-results{max-height:260px;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.search-result{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:#F1FBFF;}
.search-result .sr-text{font-weight:700;font-size:17px;font-family:'Poppins',sans-serif;}
.search-result .sr-text small{display:block;font-weight:600;color:#666;font-size:12px;font-family:'Nunito';}
.sr-actions{display:flex;gap:4px;}
.sr-btn{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:6px 8px;font-size:13px;font-weight:800;}
.sr-btn.add{background:var(--sun);}
.empty-search{color:#888;font-weight:700;font-size:13px;text-align:center;padding:14px 0;}
.box-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 10px;}
.mystery-box{width:180px;height:180px;border:6px solid var(--ink);border-radius:26px;background:repeating-linear-gradient(45deg, var(--sun), var(--sun) 14px, #FFDE7A 14px, #FFDE7A 28px);display:flex;align-items:center;justify-content:center;font-size:72px;box-shadow:8px 8px 0 var(--ink);}
.mystery-box.shaking{animation:shake .5s infinite;}
@keyframes shake{0%{transform:rotate(0deg) translate(0,0);}20%{transform:rotate(-6deg) translate(-4px,0);}40%{transform:rotate(6deg) translate(4px,0);}60%{transform:rotate(-4deg) translate(-2px,0);}80%{transform:rotate(4deg) translate(2px,0);}100%{transform:rotate(0deg) translate(0,0);}}
.reveal-card{width:230px;border:6px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:8px 8px 0 var(--ink);background:#fff;animation:pop .5s ease;}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0;}70%{transform:scale(1.08) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0deg);}}
.reveal-card img{width:100%;display:block;}
.pending-note{background:#FFF6E0;border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;font-size:13px;margin-top:14px;text-align:center;}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.post-card{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:16px;box-shadow:6px 6px 0 var(--ink);}
.post-card img{width:100%;max-width:150px;border-radius:14px;border:3px solid var(--ink);display:block;margin:0 auto 10px;}
.post-meta{font-weight:700;font-size:12px;color:#999;margin-bottom:2px;}
.post-greeting{font-family:'Poppins',sans-serif;font-weight:800;font-size:21px;margin:0 0 10px;color:var(--grape);}
.post-sentences{font-size:17px;font-weight:600;line-height:1.65;margin-bottom:8px;font-family:'Poppins',sans-serif;}
.post-sentences .can{color:#0E8F7A;}
.post-sentences .cant{color:#D6482F;}
.post-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.iconbtn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;}
.iconbtn.liked{background:#FFE1E9;}
.iconbtn.approve{background:#D9F7E8;}
.iconbtn.approved{background:#22B8A8;color:#fff;}
.feedback-box{margin-top:8px;background:#FFF6E0;border:2px dashed var(--ink);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;}
.status-pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:6px;}
.status-pill.pending{background:#FFE1B0;color:#7A4B00;}
.status-pill.approved{background:#D9F7E8;color:#0E6B4F;}
.class-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.class-tab{border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:800;background:#fff;font-size:14px;}
.class-tab.active{background:var(--grape);color:#fff;}
.empty-note{text-align:center;color:#777;font-weight:700;padding:30px 10px;grid-column:1/-1;}
.footer-note{text-align:center;font-size:12px;color:#888;margin-top:14px;font-weight:600;}
.hidden{display:none !important;}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;font-weight:800;font-size:15px;box-shadow:4px 4px 0 rgba(0,0,0,.25);z-index:9999;max-width:90%;text-align:center;animation:toastin .2s ease;}
.toast.warn{background:var(--coral);}
.toast.ok{background:var(--teal);}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-10px);}to{opacity:1;transform:translate(-50%,0);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>나만의 히어로 만들기</div>
    <div style="display:flex;gap:8px;">
      <button class="navbtn" id="boardNavBtn">&#128172; 게시판 가기</button>
      <button class="navbtn" id="teacherNavBtn">선생님 로그인</button>
    </div>
  </div>
  <div id="app"></div>
</div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
